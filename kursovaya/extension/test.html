<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Тестирование точности — Фишинг-детектор</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 1000px; margin: 20px auto; padding: 0 15px; }
    h1 { font-size: 22px; }
    button { padding: 10px 20px; font-size: 15px; cursor: pointer; margin-right: 10px; }
    #progress { margin: 10px 0; color: #555; }
    .metrics { display: flex; gap: 15px; margin: 20px 0; flex-wrap: wrap; }
    .metric { background: #f0f4ff; border: 1px solid #c9d6ff; border-radius: 8px; padding: 12px 18px; text-align: center; }
    .metric b { display: block; font-size: 24px; }
    table { border-collapse: collapse; width: 100%; margin-top: 15px; font-size: 13px; }
    th, td { border: 1px solid #ccc; padding: 6px 8px; text-align: left; vertical-align: top; }
    th { background: #eef2ff; }
    .ok { color: #1a7f1a; font-weight: bold; }
    .err { color: #c00; font-weight: bold; }
    .cm td { text-align: center; font-size: 16px; padding: 10px 20px; }
  </style>
</head>
<body>
  <h1>🧪 Тестовый стенд точности классификации</h1>
  <p>Датасет: 40 писем (20 фишинговых, 20 легитимных). Положительный класс = «фишинг» (уровни high/critical).</p>
  <button id="runBtn">▶️ Запустить тесты</button>
  <button id="copyBtn" disabled>📋 Скопировать результаты (JSON)</button>
  <div id="progress"></div>
  <div id="results"></div>
  <script src="test.js"></script>
</body>
</html>
