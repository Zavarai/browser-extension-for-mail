<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 350px; padding: 15px; font-family: Arial; }
    button {
      width: 100%;
      padding: 10px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover { background: #45a049; }
    #result { margin-top: 15px; padding: 10px; background: #f5f5f5; border-radius: 5px; }
    .loading { color: #666; }
  </style>
</head>
<body>
  <h3>🛡️ Фишинг-детектор</h3>
  <button id="checkBtn">Проверить текст на странице</button>
  <div id="result">Нажмите кнопку для анализа...</div>

  <script src="popup.js"></script>
</body>
</html>
